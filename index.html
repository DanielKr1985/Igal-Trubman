<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="עו&quot;ד יגאל טרובמן - עורך דין פלילי מומחה | Адвокат Игаль Трубман - Специалист по уголовному праву">
<title>עו"ד יגאל טרובמן | Адвокат Игаль Трубман</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root {
  --gold: #c9a84c;
  --gold-hover: #dbbe6a;
  --gold-dim: rgba(201,168,76,0.18);
  --gold-border: rgba(201,168,76,0.3);
  --bg: #0d1535;
  --bg2: #111d42;
  --bg3: #162249;
  --card: #1a2d55;
  --card2: #1f3565;
  --text: #eaeaea;
  --text-muted: #8892a4;
  --text-light: #c5cdd8;
  --white: #ffffff;
  --radius: 12px;
  --shadow: 0 8px 40px rgba(0,0,0,0.5);
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior:smooth; font-size:16px; }

body {
  font-family:'Heebo','Arial',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  overflow-x:hidden;
}

body.ltr { font-family:'Heebo','Arial',sans-serif; }

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--gold-border); border-radius:3px; }

/* ─── SELECTION ─── */
::selection { background:var(--gold); color:var(--bg); }

/* ─── UTILITY ─── */
.container { max-width:1200px; margin:0 auto; padding:0 24px; }
.section-badge {
  display:inline-block;
  font-size:0.78rem;
  font-weight:700;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--gold);
  background:var(--gold-dim);
  border:1px solid var(--gold-border);
  border-radius:50px;
  padding:5px 16px;
  margin-bottom:18px;
}
.section-title {
  font-family:'Playfair Display',serif;
  font-size:clamp(2rem,4vw,2.8rem);
  font-weight:700;
  color:var(--white);
  line-height:1.2;
  margin-bottom:14px;
}
.section-subtitle {
  font-size:1.05rem;
  color:var(--text-muted);
  max-width:600px;
  margin:0 auto 56px;
}
.gold-line {
  width:60px; height:3px;
  background:linear-gradient(90deg,var(--gold),transparent);
  border-radius:2px;
  margin:16px 0 28px;
}
[dir="ltr"] .gold-line { background:linear-gradient(90deg,var(--gold),transparent); }
[dir="rtl"] .gold-line { background:linear-gradient(270deg,var(--gold),transparent); margin-right:0; }

/* ─── NAVIGATION ─── */
#navbar {
  position:fixed; top:0; left:0; right:0; z-index:1000;
  padding:20px 0;
  transition:var(--transition);
}
#navbar.scrolled {
  background:rgba(6,9,15,0.97);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding:12px 0;
  border-bottom:1px solid var(--gold-border);
  box-shadow:0 4px 30px rgba(0,0,0,0.4);
}
.nav-inner {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}
.nav-logo {
  text-decoration:none;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}
.nav-logo-main {
  font-family:'Playfair Display',serif;
  font-size:1.25rem;
  font-weight:700;
  color:var(--white);
  white-space:nowrap;
  line-height:1.2;
}
.nav-logo-sub {
  font-size:0.72rem;
  color:var(--gold);
  letter-spacing:0.06em;
  font-weight:500;
}
.nav-links {
  display:flex;
  align-items:center;
  gap:8px;
  list-style:none;
}
.nav-links a {
  text-decoration:none;
  font-size:0.9rem;
  font-weight:500;
  color:var(--text-light);
  padding:7px 14px;
  border-radius:8px;
  transition:var(--transition);
  white-space:nowrap;
}
.nav-links a:hover, .nav-links a.active {
  color:var(--gold);
  background:var(--gold-dim);
}
.nav-right {
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}
.lang-switcher {
  display:flex;
  align-items:center;
  background:var(--card);
  border:1px solid var(--gold-border);
  border-radius:50px;
  padding:3px;
  gap:2px;
}
.lang-btn {
  background:none;
  border:none;
  cursor:pointer;
  font-family:'Heebo',sans-serif;
  font-size:0.8rem;
  font-weight:700;
  color:var(--text-muted);
  padding:5px 13px;
  border-radius:50px;
  transition:var(--transition);
  letter-spacing:0.04em;
}
.lang-btn.active {
  background:var(--gold);
  color:var(--bg);
}
.lang-btn:hover:not(.active) { color:var(--gold); }
.nav-cta {
  background:linear-gradient(135deg,var(--gold),#a07830);
  color:var(--bg) !important;
  font-weight:700 !important;
  padding:9px 20px !important;
  border-radius:8px !important;
  border:none;
  cursor:pointer;
  font-size:0.85rem;
  text-decoration:none;
  display:inline-block;
  transition:var(--transition) !important;
  white-space:nowrap;
}
.nav-cta:hover { transform:translateY(-1px); box-shadow:0 4px 20px rgba(201,168,76,0.35); background:var(--gold-hover) !important; }

.hamburger {
  display:none;
  background:none;
  border:1px solid var(--gold-border);
  border-radius:8px;
  padding:8px;
  cursor:pointer;
  flex-direction:column;
  gap:5px;
}
.hamburger span {
  display:block;
  width:22px; height:2px;
  background:var(--gold);
  border-radius:2px;
  transition:var(--transition);
}

/* mobile menu */
.mobile-menu {
  display:none;
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(6,9,15,0.98);
  z-index:999;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
}
.mobile-menu.open { display:flex; }
.mobile-menu a {
  font-size:1.5rem;
  font-weight:600;
  color:var(--text);
  text-decoration:none;
  transition:var(--transition);
}
.mobile-menu a:hover { color:var(--gold); }
.mobile-close {
  position:absolute;
  top:24px; right:24px;
  background:none; border:none;
  color:var(--text-muted); font-size:1.8rem;
  cursor:pointer; transition:var(--transition);
}
[dir="rtl"] .mobile-close { right:auto; left:24px; }
.mobile-close:hover { color:var(--gold); }

/* ─── HERO ─── */
#hero {
  min-height:100vh;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  padding:120px 0 80px;
}
.hero-bg {
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 60% 80% at 80% 100%, rgba(15,30,60,0.8) 0%, transparent 60%),
    linear-gradient(160deg, #0d1535 0%, #111d42 40%, #0e1a3a 100%);
}
.hero-grid-overlay {
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 80%);
}
.hero-orb {
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  pointer-events:none;
}
.hero-orb-1 {
  width:600px; height:600px;
  background:radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
  top:-200px; right:-200px;
}
.hero-orb-2 {
  width:400px; height:400px;
  background:radial-gradient(circle, rgba(15,40,90,0.4) 0%, transparent 70%);
  bottom:-100px; left:-100px;
}
.hero-content {
  position:relative;
  z-index:1;
  max-width:760px;
}
[dir="rtl"] .hero-content { margin-right:0; }
[dir="ltr"] .hero-content { margin-left:0; }
.hero-badge {
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:0.8rem;
  font-weight:600;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--gold);
  background:var(--gold-dim);
  border:1px solid var(--gold-border);
  border-radius:50px;
  padding:7px 18px;
  margin-bottom:28px;
  animation:fadeInUp 0.8s ease both;
}
.hero-badge::before {
  content:'';
  width:6px; height:6px;
  background:var(--gold);
  border-radius:50%;
  animation:pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.5; transform:scale(1.3); }
}
.hero-title {
  font-family:'Playfair Display',serif;
  font-size:clamp(2.8rem,6vw,4.5rem);
  font-weight:700;
  color:var(--white);
  line-height:1.1;
  margin-bottom:16px;
  animation:fadeInUp 0.8s ease 0.1s both;
}
.hero-title span { color:var(--gold); }
.hero-subtitle {
  font-size:1.05rem;
  font-weight:500;
  color:var(--gold);
  letter-spacing:0.04em;
  margin-bottom:20px;
  animation:fadeInUp 0.8s ease 0.2s both;
}
.hero-tagline {
  font-size:1.15rem;
  color:var(--text-light);
  max-width:580px;
  line-height:1.75;
  margin-bottom:44px;
  animation:fadeInUp 0.8s ease 0.3s both;
}
.hero-actions {
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  animation:fadeInUp 0.8s ease 0.4s both;
}
.btn-primary {
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(135deg,var(--gold),#9a7830);
  color:var(--bg);
  font-family:'Heebo',sans-serif;
  font-size:0.95rem;
  font-weight:700;
  padding:14px 30px;
  border-radius:10px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  transition:var(--transition);
  box-shadow:0 4px 20px rgba(201,168,76,0.3);
}
.btn-primary:hover {
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(201,168,76,0.45);
  background:linear-gradient(135deg,var(--gold-hover),#b08840);
}
.btn-secondary {
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:transparent;
  color:var(--text-light);
  font-family:'Heebo',sans-serif;
  font-size:0.95rem;
  font-weight:600;
  padding:13px 28px;
  border-radius:10px;
  text-decoration:none;
  border:1px solid rgba(255,255,255,0.2);
  cursor:pointer;
  transition:var(--transition);
}
.btn-secondary:hover {
  border-color:var(--gold);
  color:var(--gold);
  background:var(--gold-dim);
}
.hero-stats {
  display:flex;
  gap:40px;
  margin-top:56px;
  padding-top:40px;
  border-top:1px solid rgba(255,255,255,0.08);
  animation:fadeInUp 0.8s ease 0.5s both;
}
.hero-stat-num {
  font-family:'Playfair Display',serif;
  font-size:2.2rem;
  font-weight:700;
  color:var(--gold);
  line-height:1;
  margin-bottom:4px;
}
.hero-stat-label {
  font-size:0.82rem;
  color:var(--text-muted);
  font-weight:500;
}
.hero-scroll {
  position:absolute;
  bottom:36px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  color:var(--text-muted);
  font-size:0.75rem;
  letter-spacing:0.1em;
  animation:bounce 2s infinite;
  text-decoration:none;
  z-index:1;
}
.hero-scroll svg { color:var(--gold); }
@keyframes bounce {
  0%,100% { transform:translateX(-50%) translateY(0); }
  50% { transform:translateX(-50%) translateY(8px); }
}

/* ─── ABOUT ─── */
#about {
  padding:100px 0;
  background:var(--bg2);
  position:relative;
  overflow:hidden;
}
#about::before {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--gold-border), transparent);
}
.about-grid {
  display:grid;
  grid-template-columns:1fr 1.6fr;
  gap:64px;
  align-items:center;
}
[dir="rtl"] .about-grid { direction:rtl; }
.about-image-wrap {
  position:relative;
}
.about-image-box {
  position:relative;
  border-radius:16px;
  overflow:hidden;
  aspect-ratio:3/4;
  background:var(--card);
  border:1px solid var(--gold-border);
}
.about-image-box svg {
  width:100%; height:100%;
}
.about-image-badge {
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(6,9,15,0.95);
  border:1px solid var(--gold-border);
  border-radius:10px;
  padding:12px 20px;
  text-align:center;
  backdrop-filter:blur(10px);
  white-space:nowrap;
}
.about-image-badge strong {
  display:block;
  font-size:0.95rem;
  color:var(--white);
  margin-bottom:2px;
}
.about-image-badge span {
  font-size:0.75rem;
  color:var(--gold);
}
.about-image-corner {
  position:absolute;
  width:80px; height:80px;
  border-color:var(--gold);
  border-style:solid;
  border-width:0;
  opacity:0.6;
}
.about-image-corner.tl { top:-8px; left:-8px; border-top-width:2px; border-left-width:2px; border-radius:4px 0 0 0; }
.about-image-corner.br { bottom:-8px; right:-8px; border-bottom-width:2px; border-right-width:2px; border-radius:0 0 4px 0; }
[dir="rtl"] .about-image-corner.tl { left:auto; right:-8px; border-left-width:0; border-right-width:2px; border-radius:0 4px 0 0; }
[dir="rtl"] .about-image-corner.br { right:auto; left:-8px; border-right-width:0; border-left-width:2px; border-radius:0 0 0 4px; }
.about-text p {
  color:var(--text-light);
  margin-bottom:18px;
  font-size:1.02rem;
  line-height:1.85;
}
.about-stats {
  display:flex;
  gap:24px;
  margin:32px 0;
  flex-wrap:wrap;
}
.about-stat {
  flex:1;
  min-width:100px;
  background:var(--card);
  border:1px solid var(--gold-border);
  border-radius:12px;
  padding:20px 16px;
  text-align:center;
}
.about-stat-num {
  font-family:'Playfair Display',serif;
  font-size:2rem;
  font-weight:700;
  color:var(--gold);
  line-height:1;
  margin-bottom:6px;
}
.about-stat-label {
  font-size:0.78rem;
  color:var(--text-muted);
}
.qualifications {
  background:var(--card);
  border:1px solid var(--gold-border);
  border-radius:12px;
  padding:24px;
  margin-top:28px;
}
.qual-title {
  font-size:0.88rem;
  font-weight:700;
  color:var(--gold);
  letter-spacing:0.06em;
  text-transform:uppercase;
  margin-bottom:16px;
}
.qual-list {
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.qual-list li {
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-size:0.9rem;
  color:var(--text-light);
}
.qual-check {
  width:18px; height:18px;
  background:var(--gold-dim);
  border:1px solid var(--gold-border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  margin-top:2px;
}
.qual-check svg { color:var(--gold); }

/* ─── SERVICES ─── */
#services {
  padding:100px 0;
  background:var(--bg);
  position:relative;
}
#services::before {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--gold-border), transparent);
}
.services-header { text-align:center; }
.services-header .section-subtitle { margin:0 auto 56px; }
.services-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:24px;
}
.service-card {
  background:var(--card);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius);
  padding:32px 28px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  cursor:default;
}
.service-card::before {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, var(--gold-dim) 0%, transparent 60%);
  opacity:0;
  transition:var(--transition);
}
.service-card:hover {
  border-color:var(--gold-border);
  transform:translateY(-4px);
  box-shadow:0 16px 40px rgba(0,0,0,0.4);
}
.service-card:hover::before { opacity:1; }
.service-icon {
  width:52px; height:52px;
  background:var(--gold-dim);
  border:1px solid var(--gold-border);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
  position:relative;
  transition:var(--transition);
}
.service-icon svg { color:var(--gold); }
.service-card:hover .service-icon {
  background:var(--gold);
}
.service-card:hover .service-icon svg { color:var(--bg); }
.service-card h3 {
  font-size:1.1rem;
  font-weight:700;
  color:var(--white);
  margin-bottom:10px;
  line-height:1.3;
}
.service-card p {
  font-size:0.88rem;
  color:var(--text-muted);
  line-height:1.7;
}
.service-arrow {
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:16px;
  font-size:0.82rem;
  font-weight:600;
  color:var(--gold);
  opacity:0;
  transition:var(--transition);
}
.service-card:hover .service-arrow { opacity:1; }

/* ─── TESTIMONIALS ─── */
#testimonials {
  padding:100px 0;
  background:var(--bg2);
  position:relative;
}
#testimonials::before {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--gold-border), transparent);
}
.testimonials-header { text-align:center; }
.testimonials-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}
.testimonial-card {
  background:var(--card);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius);
  padding:32px;
  transition:var(--transition);
  position:relative;
  display:flex;
  flex-direction:column;
}
.testimonial-card:hover {
  border-color:var(--gold-border);
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}
.testimonial-quote {
  font-size:3rem;
  line-height:1;
  color:var(--gold);
  opacity:0.3;
  font-family:Georgia,serif;
  margin-bottom:8px;
}
.testimonial-stars {
  display:flex;
  gap:3px;
  margin-bottom:16px;
}
.star { color:var(--gold); font-size:0.9rem; }
.testimonial-text {
  font-size:0.95rem;
  color:var(--text-light);
  line-height:1.8;
  flex:1;
  font-style:italic;
}
.testimonial-author {
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex;
  align-items:center;
  gap:12px;
}
.author-avatar {
  width:44px; height:44px;
  background:linear-gradient(135deg, var(--gold-dim), var(--card2));
  border:1px solid var(--gold-border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:0.9rem;
  font-weight:700;
  color:var(--gold);
  flex-shrink:0;
}
.author-name {
  font-weight:700;
  font-size:0.9rem;
  color:var(--white);
  margin-bottom:2px;
}
.author-case {
  font-size:0.78rem;
  color:var(--gold);
}

/* ─── CONTACT ─── */
#contact {
  padding:100px 0;
  background:var(--bg);
  position:relative;
}
#contact::before {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--gold-border), transparent);
}
.contact-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:56px;
  align-items:start;
}
.contact-form-card {

// ─── STATE ──────────────────────────────────────────────────
let currentLang = 'he';

// ─── LANGUAGE SWITCH ────────────────────────────────────────
function setLang(lang) {
  currentLang = lang;
  const html = document.documentElement;
  html.lang = lang;
  html.dir = lang === 'he' ? 'rtl' : 'ltr';

  // update all keyed elements
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    const text = i18n[lang][key];
    if (text !== undefined) el.textContent = text;
  });

  // update lang buttons
  ['langHe','mobileLangHe'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.classList.toggle('active', lang === 'he');
  });
  ['langRu','mobileLangRu'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.classList.toggle('active', lang === 'ru');
  });

  // update form placeholder/labels dynamically by also targeting inputs
  const formSuccess = document.getElementById('formSuccess');
  if (formSuccess) {
    formSuccess.setAttribute('data-key','contact.fsuccess');
    formSuccess.textContent = i18n[lang]['contact.fsuccess'];
  }
}

// ─── NAVBAR SCROLL ──────────────────────────────────────────
const navbar = document.getElementById('navbar');
window.addEventListener('scroll', () => {
  navbar.classList.toggle('scrolled', window.scrollY > 40);
  highlightNav();
}, { passive: true });

// ─── NAV ACTIVE HIGHLIGHTING ────────────────────────────────
function highlightNav() {
  const sections = ['hero','about','services','testimonials','press','contact'];
  const scrollY = window.scrollY + 100;
  let current = 'hero';
  sections.forEach(id => {
    const el = document.getElementById(id);
    if (el && el.offsetTop <= scrollY) current = id;
  });
  document.querySelectorAll('.nav-links a').forEach(a => {
    const href = a.getAttribute('href');
    a.classList.toggle('active', href === '#' + current);
  });
}

document.getElementById('hamburger').addEventListener('click', () => {
  document.getElementById('mobileMenu').classList.add('open');
});
document.getElementById('mobileClose').addEventListener('click', () => {
  document.getElementById('mobileMenu').classList.remove('open');
});
document.querySelectorAll('.mobile-link').forEach(a => {
  a.addEventListener('click', () => {
    document.getElementById('mobileMenu').classList.remove('open');
  });
});

// ─── SCROLL REVEAL ──────────────────────────────────────────
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// ─── CONTACT FORM ────────────────────────────────────────────
document.getElementById('contactForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn     = this.querySelector('button[type=submit]');
  const success = document.getElementById('formSuccess');
  const originalHTML = btn.innerHTML;

  // Basic validation
  const name    = document.getElementById('fname').value.trim();
  const email   = document.getElementById('femail').value.trim();
  const phone   = document.getElementById('fphone').value.trim();
  const subject = document.getElementById('fsubject').value;
  const message = document.getElementById('fmessage').value.trim();
  if (!name || !email || !message) return;

  // Loading state
  btn.disabled = true;
  btn.innerHTML = '<span style="opacity:.7">' + (currentLang === 'he' ? 'שולח...' : 'Отправка...') + '</span>';

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    from_name:    name,
    from_email:   email,
    phone:        phone || '—',
    subject:      subject || '—',
    message:      message,
    to_email:     'itrubman@gmail.com',
    reply_to:     email,
  })
  .then(() => {
    success.classList.add('show');
    success.textContent = i18n[currentLang]['contact.fsuccess'];
    this.reset();
    setTimeout(() => success.classList.remove('show'), 7000);
  })
  .catch((err) => {
    console.error('EmailJS error:', err);
    success.style.background  = 'rgba(239,68,68,0.1)';
    success.style.borderColor = 'rgba(239,68,68,0.3)';
    success.style.color       = '#f87171';
    success.classList.add('show');
    success.textContent = currentLang === 'he'
      ? '⚠ שגיאה בשליחה. אנא נסה שוב או התקשר ישירות.'
      : '⚠ Ошибка отправки. Попробуйте ещё раз или позвоните напрямую.';
    setTimeout(() => {
      success.classList.remove('show');
      success.removeAttribute('style');
    }, 7000);
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  });
});

// ─── YEAR ────────────────────────────────────────────────────
document.getElementById('year').textContent = new Date().getFullYear();

// ─── INIT ────────────────────────────────────────────────────
setLang('he');
</script>
